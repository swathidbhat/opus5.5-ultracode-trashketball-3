<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a24" />
    <meta name="description" content="Trashketball: throw crumpled paper into the bin, from the Severed floor to a beach house." />
    <title>Trashketball</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 22h36l-4 34H18z' fill='%23384048'/%3E%3Ccircle cx='34' cy='14' r='10' fill='%23f4f1e8' stroke='%23b8b2a2' stroke-width='2'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1a24;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        gap: 18px;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #e8f4f4;
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
        background: #0b1a24;
      }
      #fatal p {
        max-width: 34em;
        margin: 0;
      }
      #fatal button {
        font: 600 14px/1 system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 12px 22px;
        border: 0;
        border-radius: 6px;
        color: #06222b;
        background: #8ff0e2;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Trashketball game view"></canvas>
    <div id="ui-root"></div>
    <div id="fatal" role="alert"></div>
    <noscript>Trashketball needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
