<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UI preview</title>
  <style>
    /* Stand-in backdrops that mimic the brightness and colours of each level, to judge legibility. */
    .bd { position: fixed; inset: 0; overflow: hidden; }
    .bd-office {
      background:
        linear-gradient(180deg, #f3faf7 0 7%, #d9e4de 7% 9%, #e5ede8 9% 52%, #c7d3cc 52% 53%, #3c664f 53%, #2a4a3a 100%);
    }
    .bd-office::before { /* ceiling light panels */
      content: ''; position: absolute; left: 8%; right: 8%; top: 1.5%; height: 3.5%;
      background: repeating-linear-gradient(90deg, #ffffff 0 16%, transparent 16% 21%);
      filter: blur(1px); opacity: .95;
    }
    .bd-office::after { /* desks + bin */
      content: ''; position: absolute; left: 0; right: 0; top: 46%; height: 20%;
      background:
        radial-gradient(ellipse 3.2% 9% at 50% 68%, #9aa39f 0 60%, transparent 62%),
        linear-gradient(90deg, transparent 0 6%, #f4f4f0 6% 30%, transparent 30% 70%, #f4f4f0 70% 94%, transparent 94%) 0 30% / 100% 22% no-repeat,
        linear-gradient(90deg, transparent 0 8%, #6c7c74 8% 28%, transparent 28% 72%, #6c7c74 72% 92%, transparent 92%) 0 70% / 100% 40% no-repeat;
    }
    .bd-beach {
      background:
        linear-gradient(180deg, #fbf8f3 0 10%, #f3ede4 10% 16%,
          #9fd3ea 16%, #c9e9f5 36%, #e8f6fa 42%, #3aa2bd 42%, #57b5c9 50%, #f2e2c1 50% 58%, #caa77c 58%, #b58d61 100%);
    }
    .bd-beach::before { /* window mullions */
      content: ''; position: absolute; left: 0; right: 0; top: 16%; height: 42%;
      background: repeating-linear-gradient(90deg, #f7f3ec 0 1.2%, transparent 1.2% 20%);
    }
    .bd-beach::after { /* sofa */
      content: ''; position: absolute; left: 12%; right: 12%; top: 60%; height: 18%;
      background:
        linear-gradient(#efe6d8, #e2d4bf) 0 0 / 100% 55% no-repeat,
        linear-gradient(#e6dac7, #d4c3aa) 0 100% / 100% 45% no-repeat;
      border-radius: 40px 40px 10px 10px; box-shadow: 0 30px 60px rgba(80, 50, 20, .25);
    }
    .bd-dark { background: radial-gradient(ellipse at 50% 40%, #213447, #070d14); }
    #results {
      position: fixed; left: 12px; top: 12px; bottom: 12px; z-index: 50; overflow: auto; max-width: min(760px, calc(100vw - 24px));
      font: 12px/1.45 ui-monospace, Menlo, monospace; color: #e7f3f1; background: rgba(4, 12, 20, .92);
      border: 1px solid #28485a; border-radius: 8px; padding: 12px 14px; display: none; white-space: pre-wrap;
    }
    #results.on { display: block; }
    #results .pass { color: #7ef0b5; } #results .fail { color: #ff8f8f; font-weight: 700; }
    #results canvas { display: block; background: #0b1a26; border-radius: 4px; margin: 2px 0 8px; }
    #results button { font: inherit; margin: 2px 4px 2px 0; padding: 3px 8px; cursor: pointer; }
    /* Screenshot mode: headless Chrome's virtual clock stalls while anything animates over backdrop-filter,
       so drop all motion and show each element at a representative static pose. */
    body.freeze *, body.freeze *::before, body.freeze *::after { transition: none !important; animation: none !important; }
    body.freeze .tk-flash-burst { transform: scale(2.2, 1.3); opacity: .35; }
    body.freeze .tk-intro-timer span { transform: scaleX(.65); }
    body.freeze .tk-confetti i { transform: translate3d(0, var(--y, 50vh), 0) rotate(var(--r)); }
  </style>
</head>
<body>
  <div class="bd" id="backdrop"></div>
  <canvas id="game"></canvas>
  <div id="ui-root"></div>
  <div id="results"></div>
  <script type="module" src="./ui-preview.js"></script>
</body>
</html>
