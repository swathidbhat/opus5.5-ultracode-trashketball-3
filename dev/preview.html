<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Level preview</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }
    #info { position: fixed; left: 8px; top: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #fff;
            background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 4px; white-space: pre; pointer-events: none; }
    #err { position: fixed; left: 8px; bottom: 8px; right: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #ffb4b4;
           background: rgba(60,0,0,.8); padding: 6px 8px; border-radius: 4px; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>
  <div id="info"></div>
  <div id="err"></div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
